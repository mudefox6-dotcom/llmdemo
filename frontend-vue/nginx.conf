server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # 用 llmdemo-api 而不是 api：生产环境本容器同时接入了入口网关的共享网络，
        # 那张网络上已经存在别的项目的 api 服务，用 "api" 会解析到别人的容器（502）。
        # 服务名在跨项目共享网络里不唯一，必须用带项目前缀的名字。
        proxy_pass http://llmdemo-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 必须关缓冲，否则 nginx 会攒够一块才下发，前端看到的进度是一卡一卡的
        proxy_buffering off;
        proxy_cache off;
        # SSE 长连接：Agent 单个节点可能跑几分钟，期间没有事件下发。
        # nginx 默认 proxy_read_timeout 是 60s，而后端心跳间隔 120s——
        # 不放宽这里，连接会被 nginx 每分钟掐断一次，前端反复重连、进度条闪断。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
